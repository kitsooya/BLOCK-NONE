modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = "Fixes the crawl conflict between ParCool and TACZ."

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "tacz"
type = "required"
versionRange = "[1.1.8,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "parcool"
type = "required"
versionRange = "[3.4.0,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "mixins.taczcool.json"